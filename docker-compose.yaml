version: "3.3"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend1
    ports:
      - "3000:3000"
    volumes:
      - /home/wasa/backend-data-backup:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend1
    ports:
      - "4173:80"
    depends_on:
      - backend
    restart: unless-stopped