openapi: 3.0.3
servers:
  - url: "http://localhost:3000"
info:
  title: WASAText
  description: |-
   Connect with your friends effortlessly using WASAText!
   Send and receive messages, whether one-on-one or in groups,   all from
   the convenience of your PC. Enjoy seamless conversations with text or
   GIFs and easily stay in touch through your private chats or group
   discussions.
  version: 1.0.0
security:
  - BearerAuth: []


tags:
  - name: login
    description: ops related to login or account creation
  - name: chatlvl
    description: ops on one chat/group
  - name: msglvl
    description: ops on a single message
  - name: pfl
    description: ops on one's or someone else's profile
  - name: user
    description: ops on a user
  - name: reac
    description: op on a reaction
  - name: General
    description: app updates, generic info

paths:
  /status:
    parameters:
      - $ref: "#/components/parameters/XAppBuild"
      - $ref: "#/components/parameters/XAppVersion"
      - $ref: "#/components/parameters/XAppLanguage"
    get:
      tags: ["General"]
      operationId: getStatusMessage
      summary: Get status message for the user about issues / updates
      description: |-
        The response contains a status message meant for the user. It might
        contains information about current technical issues, update messages
        or general information.
      responses:
        "200":
          description: Status message available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusInfo"
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /session: 
    post:
      tags: ["login"]
      summary: logs in the user
      description: |-
        creates a user if it doesn't exist, and returns identifier
        if it exists, just returns the user identifier
      operationId: doLogin
      requestBody:
        description: user details
        required: true
        content:
          application/json:
            schema:
              type: object
              description: request contains the userID of the requestor
              required:
                - name
              properties:
                name:
                  type: string
                  description: unique alphanum username
                  example: Maria02
                  minLength: 3
                  maxLength: 16
                  pattern: '^[a-zA-Z0-9]+$'
      responses:
        '201':
          description: user login successful
          content:
            application/json:
              schema:
                type: object
                description: bearer authentication identifier
                properties:
                  identifier:
                    type: string
                    description: identifier of auth user
                    pattern: '^[a-zA-Z0-9]+$'
                    example: "gugugaga555"
        '400': {$ref: "#/components/responses/BadRequest"}
        '500': {$ref: "#/components/responses/InternalServerError"}

  /users:
    get:
      operationId: searchUsers
      summary: finds users based on search key
      description: finds all users that contain the search key (case-sensitive), returns a list of users
      tags: ["user"]
      parameters:
        - in: query
          name: searchkey
          required: false
          description: part or whole username to look for
          schema:
            type: string
            pattern: '^[a-zA-Z0-9]+$'
            minLength: 1
            maxLength: 16

      responses:
        '200':
          description: user list found
          content:
            application/json:
              schema:
                type: array
                description: list of users that match the search key
                items:
                  $ref: "#/components/schemas/User"
        '204': { $ref: "#/components/responses/NoContent"}
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /users/{userID}:
    get:
      operationId: getUserProfile
      summary: gets user info, including oneself
      tags: ["user"]
      description: fetches username and profile picture, returns bad req if user is not found
      responses:
        '200':
          description: 'user info'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound"}
        "500": { $ref: "#/components/responses/InternalServerError" }
    parameters:
      - $ref: "#/components/parameters/userID"

  /profile/username:
    put:
      operationId: setMyUserName
      tags: ["user", "pfl"]
      summary: change username
      description: |-
        Modifies current username to another unique alphanum string
        chosen by the user
      requestBody:
        required: true
        description: new username for auth user
        content:
            application/json:
              schema:
                type: object
                description: req containing new username to apply to auth user
                required:
                  - targetusername
                properties:
                  targetusername:
                    type: string
                    description: new username
                    example: Maria03
                    minLength: 3
                    maxLength: 16
                    pattern: '^[a-zA-Z0-9]+$'
      responses:
        '204': { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }


  /profile/photo:
    put:
      operationId: setMyPhoto
      tags: ["pfl"]
      summary: changes one's profile picture
      description: |-
        Modifies current profile photo to another. Optional feature: when
        user deletes their own photo/chooses not to have one, use a black
        or white picture
      requestBody:
        content:
            image/jpeg:
              schema:
                type: string
                description: the image file of the new profile picture
                format: binary
        required: true
      responses:
        '204': { $ref: "#/components/responses/NoContent"}
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /chats:
    get:
      operationId: getMyConversations
      tags: ["chatlvl"]
      summary: gets one's conversations in a list
      description: |-
        returns all chats in reverse chronological order, along with the
        latest message preview and timestamp
      responses:
        '200':
          description: list of conversations
          content:
            application/json:
              schema:
                type: array
                description: user's chat list 
                items:
                  $ref: "#/components/schemas/Chat"
        '204': {$ref: "#/components/responses/NoContent"}
        '500': {$ref: "#/components/responses/InternalServerError"}

    post: 
      operationId: makeChat
      tags: ["chatlvl"]
      summary: create a new chat
      description: |- 
        returns the chat if successful. (check that, if chat  already
        exists, it doesn't do anything but returns that chat)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: list of (2) members in the private chat to-be
              required:
                - members
              properties:
                chatName:
                  type: string
                  pattern: '^[a-zA-Z0-9]+'
                photo:
                  type: string
                  format: uri
                members:
                  type: array
                  items:
                    type: string
                    pattern: '^[a-zA-Z0-9]+'
      responses:
        '201':
          description: made a new chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
          links: 
            getConversation:
              operationId: getConversation
              description: the chat output can be used to look for that chat resource
              parameters:
                chatID: $response.body#/chatID
        '400': {$ref: "#/components/responses/BadRequest"}
        '409':
          description: convo with this user/group exists already
        '500': {$ref: "#/components/responses/InternalServerError"}


  /chats/groups: 
    post: 
      operationId: makeGroup
      tags: ["chatlvl"]
      summary: create a new group
      description: |-
        makes a new group, returns a chat.
        requesting user added to members by api handler
        CHECK: do I use addmember in this func?
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              type: object
              description: list of (2 or more) users for the group
              required:
                - members
                - groupname
              properties:
                members:
                  type: array
                  items:
                    type: string
                    pattern: '^[a-zA-Z0-9]+'
                groupname:
                  type: string
                  pattern: '^[a-zA-Z0-9]+'
      responses:
        '201':
          description: made a new group
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Chat"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '500': {$ref: "#/components/responses/InternalServerError"}


  /chats/{chatID}/members/me:
    delete:
      operationId: leaveGroup
      tags: ["chatlvl"]
      summary: leave a group or chat
      description: |-
        Can work for both chats and groups because the case 
        where you leave a group and it remains with one member
        creates no conflict with self private chats, as groups are NOT
        unique
      responses:
        '204': {$ref: "#/components/responses/NoContent"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '500': {$ref: "#/components/responses/InternalServerError"}

    parameters:
      - $ref: "#/components/parameters/chatID"

  /chats/{chatID}/members:
    post:
      operationId: addToGroup
      summary: add a member to a group
      description: |-
        TODO: check if I have covered multimember adding
        adds one or multiple users to an existing group 
      tags: ["chatlvl"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: username(s) to add to groupID
              required:
                - targetusername
                - groupID
              properties:
                targetusername:
                  type: string
                  pattern: '^[a-zA-Z0-9]+'
                groupID:
                  type: string
                  pattern: '^[a-zA-Z0-9]+$'
      responses:
        '200':
          description: new member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        '400': {$ref: "#/components/responses/BadRequest"} #or user already iin group
        '403': {$ref: "#/components/responses/Forbidden"} 
        '500': {$ref: "#/components/responses/InternalServerError"}
    parameters:
      - $ref: "#/components/parameters/chatID"

  /chats/groups/{chatID}/photo:
    put: 
      operationId: setGroupPhoto
      summary: modify current group photo
      description: deletes old group photo from db and adds to db the new one
      tags: ["chatlvl"]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        '204': {$ref: "#/components/responses/NoContent"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '404': {$ref: "#/components/responses/NotFound"}
        '500': {$ref: "#/components/responses/InternalServerError"}
    parameters:
      - $ref: "#/components/parameters/chatID"

  /chats/groups/{chatID}/groupname:
    put: 
      operationId: setGroupName
      summary: modifies current group name
      description: changes db entry on group name
      tags: ["chatlvl"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              description: the new name for the groupname, and the groupID
              #CORRECT STRUCTURE HERE!
              pattern: '^[a-zA-Z0-9]+'
              minLength: 1
              maxLength: 50
      responses:
        '204': {$ref: "#/components/responses/NoContent"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '404': {$ref: "#/components/responses/NotFound"}
        '500': {$ref: "#/components/responses/InternalServerError"}
    parameters:
      - $ref: "#/components/parameters/chatID"

  /chats/{chatID}/messages:
    get:
      operationId: getConversation
      tags: ["chatlvl"]
      summary: returns a single group or chat's msg list
      description: returns all msgs in reverse chronological order (older messages are at the top)
      responses:
        '200':
          description: convo retrieved
          content:
            application/json:
              schema:
                type: array
                description: list of messages in chat
                items:
                  $ref: "#/components/schemas/Message"
        '400': {$ref: "#/components/responses/BadRequest"}
        '500': {$ref: "#/components/responses/InternalServerError"}

    post:
      operationId: sendMessage
      tags: ["msglvl"]
      summary: sned a message containing text, image or both
      description: |-
        creates a message to store both in a db entry and in memory, both
        text and image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              description: a message with text, photo or both
              #CORRECT BELOW!!!!
              oneOf:
                - $ref: "#/components/schemas/SendMessageReq"
                - $ref: "#/components/schemas/SendPhotoMessageReq"
      responses:
        '201':
          description: message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

        '400': {$ref: "#/components/responses/BadRequest"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '500': {$ref: "#/components/responses/InternalServerError"}
    parameters: 
    - $ref: "#/components/parameters/chatID"

  /chats/{chatID}/messages/{messageID}:
    delete:
      operationId: deleteMessage
      summary: deletes a message for every member of a chat or group
      description: |-
        deletes db entry, image and message text from memory
      tags: ["msglvl"]
      responses:
        '204': {$ref: "#/components/responses/NoContent"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '500': {$ref: "#/components/responses/InternalServerError"}
    parameters:
      - $ref: "#/components/parameters/chatID"
      - $ref: "#/components/parameters/messageID"

  /chats/{chatID}/messages/{messageID}/forward:
    post:
      operationId: forwardMessage
      summary: message forward
      tags: ["msglvl"]
      description: forwards messageID to destinationChatID. allowed across all chats and groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: msg ID of the msg to be forwarded
              required:
                - destinationChatID
              properties:
                destinationChatID:
                  type: string
                  pattern: '^[a-zA-Z0-9]+$'
                  description: ID of the chat the msg is being fwd to
      responses:
        '201':
          description: message forwarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '400': {$ref: "#/components/responses/BadRequest"} #target userid does not exist?
        '403': {$ref: "#/components/responses/Forbidden"}
        '500': {$ref: "#/components/responses/InternalServerError"}

    parameters:
      - $ref: "#/components/parameters/chatID"
      - $ref: "#/components/parameters/messageID"

  /chats/{chatID}/messages/{messageID}/reactions:
    post:
      operationId: commentMessage
      summary: adds a reaction to a message
      description: one reaction per user
      tags: ["reac"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reaction"
      responses:
        '201':
          description: reaction added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reaction"
          links:
            uncommentMessage:
              operationId: uncommentMessage
              description: the output can be used to check whether user has already reacted
              parameters: 
                reactionID: $response.body#/reactionID
                messageID: $request.path.messageID
                chatID: $request.path.chatID
        '400': {$ref: "#/components/responses/BadRequest"}
        #DELETED 409!
        '403': {$ref: "#/components/responses/Forbidden"}
        '500': {$ref: "#/components/responses/InternalServerError"}
    parameters:
      - $ref: "#/components/parameters/chatID"
      - $ref: "#/components/parameters/messageID"

  /chats/{chatID}/messages/{messageID}/reactions/{reactionID}:
    delete:
      operationId: uncommentMessage
      summary: removes own reaction to a message
      description: idempotent, removing again does nothing
      tags: ["reac"]
      responses:
        '204': {$ref: "#/components/responses/NoContent"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '500': {$ref: "#/components/responses/InternalServerError"}

    parameters:
      - $ref: "#/components/parameters/chatID"
      - $ref: "#/components/parameters/messageID"
      - $ref: "#/components/parameters/reactionID"


components:
  schemas:
    SendMessageReq:
      type: object
      description: the request body for sending or forwarding a message
      required:
        - content
      properties:
        content:
          type: string
          pattern: '^[a-zA-Z0-9]+$'
          minLength: 1
          maxLength: 20000
        replyTo: #should be a num? since it should be a userID?
          type: string
          pattern: '^[a-zA-Z0-9]+$'

    SendPhotoMessageReq:
      type: object
      description: the request body for sending or forwarding a picture message
      required:
        - photo
      properties:
        photo:
          type: string
          format: binary
        replyTo:
          type: string
          format: uuid
    Chat:
      type: object
      description: the set of attributes making up a chat
      required:
        - chatID
        - groupORchat
        - chatName
        - members
        - creationDate
      properties:
        chatID:
          type: string
          format: uuid
        groupORchat:
          type: string
          enum:
            - private
            - group
        chatName:
          type: string
          pattern: '^[a-zA-Z0-9]+$'
          description: username if private, groupname if group
        members:
          type: array
          items:
            type: string
            format: uuid
        creationDate:
          type: string
          format: date-time
        photo:
          description: the profile picture of the user you are chatting with, or an image chosen for the group
          type: string
          format: uri
        mostrecentmsg:
          $ref: "#/components/schemas/MessagePreview"

    User:
      title: user
      description: |-
        a generic user: can refer to oneself, or to other persons
        perusing the app from any device.
      type: object
      required:
        - username
        - userID
      properties:
        photo:
          description: the profile picture of the user you are chatting with
          type: string
          format: uri
        username:
          description: unique username, alphanumeric
          type: string
          pattern: '^[a-zA-Z0-9]+'
          example: Maria02
          minLength: 3
          maxLength: 16
          readOnly: true
        userID:
          type: string
          format: uuid
          example: ggfvg255

    Message:
      title: message
      description: a single message from a user at a specific date-time
      type: object
      required:
        - messageID
        - senderID
        - status
        - timestamp
      oneOf: 
        - required:
          - content
        - required:
          - photo
      properties:
        messageID:
          type: string
          format: uuid
        senderID:
          description: userID of the msg sender
          type: string
          format: uuid
        content:
          description: |-
            the word contents of the message, can be none if
            sending a picture
          type: string
          pattern: '^[a-zA-Z0-9]+$'
        photo:
          type: string
          format: uri
        status:
          type: string
          enum:
            - sent
            - delivered
            - read
        timestamp:
          type: string
          format: date-time
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/Reaction"
        replyTo:
          type: string
          format: uuid
          description: |-
            must contain the msg ID you're replying to. needed
            for backend to load msg preview!
        fwdFrom:
          type: string
          description: ID of the og msg that was fwd
    
    MessagePreview:
      title: message
      description: a single message from a user at a specific date-time
      type: object
      required:
        - messageID
        - timestamp
        - contentType
        #can't use content and photo
      properties:
        senderID:
          type: string
          format: uuid
        content:
          description: text of msg, absent when msg is img-only
          type: string
          pattern: '^[a-zA-Z0-9]+$'
        contentType:
          type: string
          enum:
            - text
            - photo
            - text photo
        timestamp:
          type: string
          format: date-time
        messageID:
          type: string
          format: uuid

    Reaction:
      description: |-
        an emoticon added by a user (including oneself) at the foot of a message
        feature: one reaction per user per message
      type: object
      required:
        - emoji
        - userID
        - reactionID
      properties:
        userID:
          type: string
          format: uuid
        emoji:
          type: string
          maxLength: 1
        reactionID:
          type: string
          format: uuid
    StatusInfo:
      title: Status Info
      type: object
      description: state of the app, regarding updates
      properties:
        status:
          type: string
          enum:
            - info
            - warning
            - critical
        title: { type: string }
        message: { type: string }
        url: { type: string }

  responses:
    Unauthorized: #401 Currently unused
      description: access token missing or expired
      content:
        application/json:
          schema:
            type: object
            description: error info
            properties:
              message:
                type: string
                description: 401 Unauthorised #????????????????

    BadRequest: #400
      description: request not compliant with app behaviour/needs
      content:
        application/json:
          schema:
            type: object
            description: error info
            properties:
              message:
                type: string
                description: bad req

    Forbidden:
      description: no auth for user to commit this action

    NoContent: #204
      description: success, no content


    NotFound: #404
      description: requested resource not found


    Conflict: #409
      description: resource with same key already exists

    
    InternalServerError: #500
      description: server had an internal error. More info in server logs

  securitySchemes:
      BearerAuth:
        type: http
        scheme: bearer

  parameters:
    chatID:
      name: chatID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    messageID:
      name: messageID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    userID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    reactionID:
      name: reactionID
      in: path
      required: true
      schema:
        type: string
        format: uuid



    XAppVersion:
      schema:
        type: string
        pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
        minLength: 1
        maxLength: 16
      name: WASAText version
      in: header
      required: true
      description: App human readable version ("semantic version" format)
      allowEmptyValue: false
    XAppBuild:
      schema: { type: integer }
      name: WASAText-Build
      in: header
      required: true
      description: App build number
      allowEmptyValue: false
    XAppLanguage:
      schema:
        type: string
        pattern: '^[a-z]{2}([-_][A-Z]{2})?$'
        minLength: 2
        maxLength: 8
      name: WASAText-Language
      in: header
      required: true
      description: App language in ISO 639-1 format
      allowEmptyValue: false
